[project]
name = "ibis-env-utils"
version = "0.1.0"
description = "Shared helpers for ibis verifiers envs (dataset loading, context sampling, prompts, rendering, reward)."
dependencies = [
    "pandas",
    "huggingface-hub",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["ibis_env_utils"]
